name: Go

on:
  pull_request:
  push:
    branches:
      - main
      - identity-gate-build-plan-001

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
